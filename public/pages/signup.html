<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>libHTML | signup</title>
    <link href="../css/global.css" rel="stylesheet" />
    <link href="../css/output.css" rel="stylesheet" />
    <script src="../js/main.js"></script>
  </head>
  <body
    onload="
      isLoggedIn();
      setupForm('signup');
    "
    class="flex flex-col h-screen justify-between"
  >
    <!-- NAV BAR -->
    <div class="nav-bar flex items-center justify-between p-6">
      <a href="/">
        <div class="flex items-center lg:gap-4 gap-3">
          <img class="lg:size-16 size-10" src="../assets/icon.png" />
          <div class="lg:text-4xl text-2xl font-bold">libHTML</div>
        </div>
      </a>
      <div class="lg:text-2xl text-lg font-medium flex flex-row">
        <span id="nav-login"><a href="/pages/login.html">login</a></span>
        <span id="nav-logout" onclick="logout()" class="hidden"
          ><a href="#">logout</a></span
        >
        &nbsp;•&nbsp;
        <span><a href="/pages/about.html">about</a></span>
      </div>
    </div>
    <!-- MAIN SECTION -->
    <form id="signup-form">
      <div class="flex flex-col items-center p-8 main-section">
        <div class="font-medium lg:text-6xl text-3xl lg:mb-10 mb-5">Signup</div>
        <input
          type="text"
          id="username"
          class="bg-mist-100 m-1 lg:p-2 p-1"
          placeholder="Username"
        />
        <input
          type="password"
          id="password"
          class="bg-mist-100 m-1 lg:p-2 p-1"
          placeholder="Password"
        />
        <span
          id="signupErr-username"
          class="text-red-400 lg:text-base text-xs hidden"
          >Empty username</span
        >
        <span
          id="signupErr-password"
          class="text-red-400 lg:text-base text-xs hidden"
          >Empty password</span
        >
        <span
          id="signupErr-found"
          class="text-red-400 lg:text-base text-xs hidden"
          >Username already taken</span
        >
        <button
          type="submit"
          class="mt-3 pl-2 pr-2 pt-1 pb-1 bg-mist-100 hover:bg-mist-300 text-mist-700 font-medium rounded-md"
        >
          Submit
        </button>
      </div>
    </form>
    <!-- FOOTER -->
    <div
      class="footer flex justify-between items-center bg-mist-200 lg:p-20 p-8"
    >
      <div class="flex flex-col items-baseline">
        <span class="font-medium text-mist-500 lg:text-xl text-sm">Pages</span>
        <ul class="text-mist-500 lg:text-lg text-xs pt-1">
          <li>About</li>
          <li>Login</li>
        </ul>
      </div>
      <div class="flex flex-col items-baseline">
        <span class="font-medium text-mist-500 lg:text-xl text-sm">Links</span>
        <ul class="text-mist-500 lg:text-lg text-xs pt-1">
          <li>
            <a target="_blank" href="https://github.com/ChristopherA8/libHTML"
              >Github</a
            >
          </li>
          <li><a target="_blank" href="mailto:canders@algebra.hr">Email</a></li>
        </ul>
        <!-- <div class="text-mist-500 text-sm">© Christopher Anderson</div> -->
      </div>
      <div><!-- SPACING --></div>
      <div><!-- SPACING --></div>
      <div><!-- SPACING --></div>
      <div class="flex flex-col items-baseline">
        <div class="text-mist-500 lg:text-lg text-xs">
          Written by hand ❤️<br />© Christopher Anderson
        </div>
      </div>
    </div>
  </body>
</html>
